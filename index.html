<!-- ================= CHAT AREA ================= -->

<section
    class="chat-area"
    id="chatArea">

    <div
        class="welcome"
        id="welcome">

        <div class="welcome-content">

            <p class="welcome-prompt">
                Ask me anything.
            </p>

            <!-- ================= SUGGESTIONS ================= -->

            <div class="suggestions">

                <button
                    type="button"
                    class="suggestion-button"
                    onclick="useSuggestion('What is Python?')">

                    <span class="suggestion-icon">🐍</span>

                    <span class="suggestion-text">
                        What is Python?
                    </span>

                    <span class="suggestion-arrow">→</span>

                </button>


                <button
                    type="button"
                    class="suggestion-button"
                    onclick="useSuggestion('Learn Networking')">

                    <span class="suggestion-icon">🌐</span>

                    <span class="suggestion-text">
                        Learn Networking
                    </span>

                    <span class="suggestion-arrow">→</span>

                </button>


                <button
                    type="button"
                    class="suggestion-button"
                    onclick="useSuggestion('Explain Computer Networks')">

                    <span class="suggestion-icon">💻</span>

                    <span class="suggestion-text">
                        Explain Computer Networks
                    </span>

                    <span class="suggestion-arrow">→</span>

                </button>


                <button
                    type="button"
                    class="suggestion-button"
                    onclick="useSuggestion('Help me with programming')">

                    <span class="suggestion-icon">⌨️</span>

                    <span class="suggestion-text">
                        Help me with programming
                    </span>

                    <span class="suggestion-arrow">→</span>

                </button>

            </div>

        </div>

    </div>


    <!-- ================= INPUT ================= -->

    <div class="input-section">

        <div class="input-box">

            <textarea
                id="messageInput"
                placeholder="Message My AI..."
                rows="1"
                autocomplete="off"
                aria-label="Message"></textarea>


            <!-- MICROPHONE -->

            <button
                id="micButton"
                class="mic-button"
                type="button"
                onclick="toggleVoiceInput()"
                aria-label="Voice input"
                title="Voice input">

                <svg
                    class="mic-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <rect
                        x="9"
                        y="3"
                        width="6"
                        height="11"
                        rx="3"
                        class="mic-stroke"/>

                    <path
                        d="M5.5 11.5C5.5 15.09 8.41 18 12 18C15.59 18 18.5 15.09 18.5 11.5"
                        class="mic-stroke"/>

                    <path
                        d="M12 18V21"
                        class="mic-stroke"/>

                    <path
                        d="M8.5 21H15.5"
                        class="mic-stroke"/>

                </svg>

                <span class="mic-pulse"></span>

            </button>


            <!-- SEND -->

            <button
                class="send-button"
                id="sendButton"
                onclick="sendMessage()"
                title="Send message"
                aria-label="Send message">

                ↑

            </button>

        </div>


        <div class="input-hint">
            My AI can make mistakes. Check important information.
        </div>

    </div>

</section>
