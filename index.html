<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="app">

    <!-- ================= SIDEBAR ================= -->

    <aside class="sidebar" id="sidebar">

        <div class="sidebar-header">

            <div class="brand">
                <span class="brand-icon">✦</span>
                <span>My AI</span>
            </div>

            <button
                class="close-sidebar"
                onclick="toggleSidebar()"
                aria-label="Close sidebar">
                ×
            </button>

        </div>


        <button
            class="new-chat-button"
            onclick="createNewChat()">

            <span class="new-chat-icon">＋</span>
            <span>New Chat</span>

        </button>


        <div class="history-title">
            Chat History
        </div>


        <div class="chat-list" id="chatList"></div>


        <div class="sidebar-bottom">

            <button
                class="clear-history"
                onclick="clearAllHistory()">

                <span>🗑️</span>
                <span>Clear History</span>

            </button>

        </div>

    </aside>


    <!-- ================= MAIN ================= -->

    <main class="main">

        <!-- TOP BAR -->

        <header class="topbar">

            <button
                class="menu-button"
                onclick="toggleSidebar()"
                aria-label="Open sidebar">
                ☰
            </button>


            <div class="topbar-title">

                <div class="topbar-logo">
                    ✦
                </div>

                <div>
                    <strong>My AI</strong>
                    <span>AI Assistant</span>
                </div>

            </div>


            <button
                class="theme-button"
                id="themeButton"
                onclick="toggleTheme()"
                title="Toggle theme">

                ☾

            </button>

        </header>


        <!-- ================= CHAT AREA ================= -->

        <section
            class="chat-area"
            id="chatArea">

            <div
                class="welcome"
                id="welcome">

                <div class="welcome-icon">
                    ✦
                </div>


                <div class="welcome-badge">

                    <span></span>

                    My AI is ready

                </div>


                <h1>
                    How can I help you?
                </h1>


                <p>
                    Ask me anything. I can understand
                    English, Urdu, Roman Urdu and many
                    other languages.
                </p>


                <div class="suggestions">

                    <button
                        onclick="useSuggestion('Explain Python in simple words')">

                        <span class="suggestion-icon">
                            💻
                        </span>

                        <span>
                            <strong>
                                Explain Python
                            </strong>

                            <small>
                                Learn programming easily
                            </small>
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Teach me computer networking')">

                        <span class="suggestion-icon">
                            🌐
                        </span>

                        <span>
                            <strong>
                                Learn Networking
                            </strong>

                            <small>
                                Understand networks step by step
                            </small>
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Mujhe ye topic Roman Urdu mein samjhao')">

                        <span class="suggestion-icon">
                            🇵🇰
                        </span>

                        <span>
                            <strong>
                                Roman Urdu
                            </strong>

                            <small>
                                Easy explanation in Roman Urdu
                            </small>
                        </span>

                    </button>


                    <button
                        onclick="useSuggestion('Help me with my project')">

                        <span class="suggestion-icon">
                            ✨
                        </span>

                        <span>
                            <strong>
                                Project Help
                            </strong>

                            <small>
                                Build and improve your project
                            </small>
                        </span>

                    </button>

                </div>

            </div>

        </section>


        <!-- ================= INPUT ================= -->

        <div class="input-section">

            <div class="input-box">

                <!-- TEXT INPUT -->

                <textarea
                    id="messageInput"
                    placeholder="Message My AI..."
                    rows="1"
                    autocomplete="off"
                    aria-label="Message"></textarea>


                <!-- MICROPHONE - RIGHT SIDE -->

                <button
                    id="micButton"
                    class="mic-button"
                    type="button"
                    onclick="toggleVoiceInput()"
                    aria-label="Voice input"
                    title="Voice input">

                    <svg
                        class="mic-svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg">

                        <rect
                            x="9"
                            y="3"
                            width="6"
                            height="11"
                            rx="3"
                            class="mic-stroke"/>

                        <path
                            d="M5.5 11.5C5.5 15.09 8.41 18 12 18C15.59 18 18.5 15.09 18.5 11.5"
                            class="mic-stroke"/>

                        <path
                            d="M12 18V21"
                            class="mic-stroke"/>

                        <path
                            d="M8.5 21H15.5"
                            class="mic-stroke"/>

                    </svg>

                    <span class="mic-pulse"></span>

                </button>


                <!-- SEND -->

                <button
                    class="send-button"
                    id="sendButton"
                    onclick="sendMessage()"
                    title="Send message"
                    aria-label="Send message">

                    ↑

                </button>

            </div>


            <div class="input-hint">
                My AI can make mistakes. Check important information.
            </div>

        </div>

    </main>

</div>


<script>

/* ============================================================
   GLOBAL VARIABLES
============================================================ */

let currentChatId = null;

let isLoading = false;

let recognition = null;

let isRecording = false;


/* ============================================================
   ELEMENTS
============================================================ */

const chatArea =
    document.getElementById("chatArea");

const chatList =
    document.getElementById("chatList");

const input =
    document.getElementById("messageInput");

const sendButton =
    document.getElementById("sendButton");

const micButton =
    document.getElementById("micButton");

const sidebar =
    document.getElementById("sidebar");

const themeButton =
    document.getElementById("themeButton");


/* ============================================================
   START
============================================================ */

document.addEventListener(
    "DOMContentLoaded",
    async function () {

        loadTheme();

        setupVoiceRecognition();

        await loadChatHistory();

        autoResize();

        input.focus();

    }
);


/* ============================================================
   THEME
============================================================ */

function toggleTheme() {

    document.body.classList.toggle(
        "dark-mode"
    );

    const isDark =
        document.body.classList.contains(
            "dark-mode"
        );

    localStorage.setItem(
        "myai-theme",
        isDark ? "dark" : "light"
    );

    updateThemeIcon();
}


function loadTheme() {

    const savedTheme =
        localStorage.getItem(
            "myai-theme"
        );

    if (savedTheme !== "light") {

        document.body.classList.add(
            "dark-mode"
        );

    }

    updateThemeIcon();
}


function updateThemeIcon() {

    const isDark =
        document.body.classList.contains(
            "dark-mode"
        );

    themeButton.textContent =
        isDark ? "☀" : "☾";
}


/* ============================================================
   SIDEBAR
============================================================ */

function toggleSidebar() {

    sidebar.classList.toggle(
        "open"
    );

}


/* ============================================================
   CHAT HISTORY
============================================================ */

async function loadChatHistory() {

    try {

        const response =
            await fetch("/api/chats");

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        renderChatList(
            data.chats
        );

        if (
            data.chats.length > 0 &&
            !currentChatId
        ) {

            await openChat(
                data.chats[0].id
            );

        }

    } catch (error) {

        console.error(
            "History error:",
            error
        );

    }

}


async function getChatList() {

    try {

        const response =
            await fetch("/api/chats");

        const data =
            await response.json();

        return data.chats || [];

    } catch (error) {

        return [];

    }

}


function renderChatList(chats) {

    chatList.innerHTML = "";

    if (!chats || !chats.length) {

        chatList.innerHTML = `

            <div class="empty-history">

                <div class="empty-history-icon">
                    💬
                </div>

                No previous chats

            </div>

        `;

        return;
    }


    chats.forEach(
        function (chat) {

            const item =
                document.createElement("div");

            item.className =
                "chat-history-item";


            if (
                chat.id === currentChatId
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <button
                    class="chat-history-main"
                    onclick="openChat('${escapeAttribute(chat.id)}')">

                    <span class="chat-history-icon">
                        💬
                    </span>

                    <span class="chat-history-title">
                        ${escapeHtml(
                            chat.title ||
                            "New Chat"
                        )}
                    </span>

                </button>


                <button
                    class="delete-chat"
                    onclick="deleteChat(event, '${escapeAttribute(chat.id)}')"
                    title="Delete chat">

                    ⋮

                </button>

            `;


            chatList.appendChild(
                item
            );

        }
    );

}


/* ============================================================
   CREATE CHAT
============================================================ */

async function createNewChat() {

    try {

        const response =
            await fetch(
                "/api/chats",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert(
                "Could not create a new chat."
            );

            return;

        }

        currentChatId =
            data.chat.id;

        clearChatUI();

        await loadChatHistory();

        closeMobileSidebar();

        input.focus();

    } catch (error) {

        console.error(
            "Create chat error:",
            error
        );

    }

}


/* ============================================================
   OPEN CHAT
============================================================ */

async function openChat(chatId) {

    try {

        const response =
            await fetch(
                `/api/chats/${encodeURIComponent(chatId)}`
            );

        const data =
            await response.json();

        if (!data.success) {
            return;
        }

        currentChatId =
            chatId;

        renderMessages(
            data.chat.messages || []
        );

        const chats =
            await getChatList();

        renderChatList(
            chats
        );

        closeMobileSidebar();

        input.focus();

    } catch (error) {

        console.error(
            "Open chat error:",
            error
        );

    }

}


/* ============================================================
   RENDER MESSAGES
============================================================ */

function renderMessages(messages) {

    chatArea.innerHTML = "";

    if (!messages.length) {

        showWelcome();

        return;
    }


    messages.forEach(
        function (message) {

            addMessage(
                message.role === "user"
                    ? "You"
                    : "AI",
                message.content,
                false
            );

        }
    );

    scrollToBottom();

}


/* ============================================================
   WELCOME
============================================================ */

function showWelcome() {

    chatArea.innerHTML = `

        <div
            class="welcome"
            id="welcome">

            <div class="welcome-icon">
                ✦
            </div>

            <div class="welcome-badge">

                <span></span>

                My AI is ready

            </div>

            <h1>
                How can I help you?
            </h1>

            <p>
                Ask me anything. I can understand
                English, Urdu, Roman Urdu and many
                other languages.
            </p>

            <div class="suggestions">

                <button
                    onclick="useSuggestion('Explain Python in simple words')">

                    <span class="suggestion-icon">
                        💻
                    </span>

                    <span>
                        <strong>
                            Explain Python
                        </strong>

                        <small>
                            Learn programming easily
                        </small>
                    </span>

                </button>


                <button
                    onclick="useSuggestion('Teach me computer networking')">

                    <span class="suggestion-icon">
                        🌐
                    </span>

                    <span>
                        <strong>
                            Learn Networking
                        </strong>

                        <small>
                            Understand networks step by step
                        </small>
                    </span>

                </button>


                <button
                    onclick="useSuggestion('Mujhe ye topic Roman Urdu mein samjhao')">

                    <span class="suggestion-icon">
                        🇵🇰
                    </span>

                    <span>
                        <strong>
                            Roman Urdu
                        </strong>

                        <small>
                            Easy explanation in Roman Urdu
                        </small>
                    </span>

                </button>


                <button
                    onclick="useSuggestion('Help me with my project')">

                    <span class="suggestion-icon">
                        ✨
                    </span>

                    <span>
                        <strong>
                            Project Help
                        </strong>

                        <small>
                            Build and improve your project
                        </small>
                    </span>

                </button>

            </div>

        </div>

    `;

}


/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    sender,
    message,
    shouldScroll = true
) {

    const wrapper =
        document.createElement("div");


    wrapper.className =
        sender === "You"
            ? "message user-message"
            : "message ai-message";


    /*
       AI ke liye ✦ icon.
       User ke liye koi avatar nahi.
    */

    wrapper.innerHTML = `

        ${
            sender === "AI"
                ? `
                    <div class="message-avatar">
                        ✦
                    </div>
                  `
                : ""
        }

        <div class="message-content">

            <div class="message-name">
                ${sender}
            </div>

            <div class="message-text">
                ${formatMessage(message)}
            </div>

        </div>

    `;


    chatArea.appendChild(
        wrapper
    );


    if (shouldScroll) {

        scrollToBottom();

    }

}


/* ============================================================
   FORMAT MESSAGE
============================================================ */

function formatMessage(text) {

    let escaped =
        escapeHtml(
            text || ""
        );

    const codeBlocks = [];


    escaped =
        escaped.replace(
            /```[^\n]*\n?([\s\S]*?)```/g,
            function (
                match,
                code
            ) {

                const index =
                    codeBlocks.length;

                codeBlocks.push(
                    `<pre><code>${code.trimEnd()}</code></pre>`
                );

                return `___CODE_BLOCK_${index}___`;

            }
        );


    escaped =
        escaped.replace(
            /\n/g,
            "<br>"
        );


    codeBlocks.forEach(
        function (
            block,
            index
        ) {

            escaped =
                escaped.replace(
                    `___CODE_BLOCK_${index}___`,
                    block
                );

        }
    );


    return escaped;

}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(text) {

    const div =
        document.createElement("div");

    div.textContent =
        String(text);

    return div.innerHTML;

}


function escapeAttribute(text) {

    return String(text)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );

}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage() {

    if (isLoading) {
        return;
    }


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    if (
        isRecording &&
        recognition
    ) {

        recognition.stop();

    }


    if (!currentChatId) {

        try {

            const response =
                await fetch(
                    "/api/chats",
                    {
                        method: "POST"
                    }
                );

            const data =
                await response.json();

            if (!data.success) {
                return;
            }

            currentChatId =
                data.chat.id;

        } catch (error) {

            console.error(
                "Create chat error:",
                error
            );

            return;

        }

    }


    const welcome =
        document.querySelector(
            ".welcome"
        );


    if (welcome) {

        welcome.remove();

    }


    addMessage(
        "You",
        message
    );


    input.value = "";

    autoResize();


    isLoading = true;

    sendButton.disabled = true;

    if (recognition) {
        micButton.disabled = true;
    }


    showTyping();


    try {

        const response =
            await fetch(
                "/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        message:
                            message,

                        chat_id:
                            currentChatId

                    })
                }
            );


        const data =
            await response.json();


        removeTyping();


        if (!response.ok) {

            addMessage(
                "AI",
                data.error ||
                data.reply ||
                "Something went wrong."
            );

        } else {

            addMessage(
                "AI",
                data.reply ||
                "Sorry, I couldn't generate a response."
            );


            if (data.chat_id) {

                currentChatId =
                    data.chat_id;

            }


            await loadChatHistory();

        }

    } catch (error) {

        console.error(
            "Chat error:",
            error
        );


        removeTyping();


        addMessage(
            "AI",
            "⚠️ I couldn't connect to the server. Please try again."
        );

    }


    isLoading = false;

    sendButton.disabled = false;

    if (recognition) {
        micButton.disabled = false;
    }


    input.focus();

}


/* ============================================================
   TYPING
============================================================ */

function showTyping() {

    const typing =
        document.createElement("div");


    typing.id =
        "typingIndicator";


    typing.className =
        "message ai-message";


    typing.innerHTML = `

        <div class="message-avatar">
            ✦
        </div>

        <div class="message-content">

            <div class="message-name">
                AI
            </div>

            <div class="typing">

                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    `;


    chatArea.appendChild(
        typing
    );


    scrollToBottom();

}


function removeTyping() {

    const typing =
        document.getElementById(
            "typingIndicator"
        );


    if (typing) {

        typing.remove();

    }

}


/* ============================================================
   VOICE INPUT
   NOTE:
   Voice OUTPUT / SPEECH SYNTHESIS REMOVED
============================================================ */

function setupVoiceRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        recognition = null;

        micButton.disabled = true;

        micButton.title =
            "Voice input is not supported in this browser.";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function () {

            isRecording = true;

            micButton.classList.add(
                "recording"
            );

            micButton.setAttribute(
                "aria-label",
                "Stop recording"
            );

            micButton.title =
                "Stop recording";

        };


    recognition.onresult =
        function (event) {

            let transcript = "";


            for (
                let i = 0;
                i < event.results.length;
                i++
            ) {

                transcript +=
                    event.results[i][0]
                        .transcript;

            }


            input.value =
                transcript.trim();


            autoResize();

        };


    recognition.onend =
        function () {

            isRecording = false;

            micButton.classList.remove(
                "recording"
            );

            micButton.setAttribute(
                "aria-label",
                "Voice input"
            );

            micButton.title =
                "Voice input";

        };


    recognition.onerror =
        function (event) {

            console.warn(
                "Speech recognition:",
                event.error
            );


            isRecording = false;

            micButton.classList.remove(
                "recording"
            );


            if (
                event.error ===
                "not-allowed"
            ) {

                alert(
                    "Microphone permission allow karein."
                );

            }

        };

}


/* ============================================================
   VOICE INPUT LANGUAGE
============================================================ */

function detectSpeechInputLanguage() {

    const text =
        input.value
            .trim()
            .toLowerCase();


    if (
        /[\u0600-\u06FF]/.test(text)
    ) {

        return "ur-PK";

    }


    const romanUrduWords = [

        "mujhe",
        "mujhy",
        "aap",
        "apko",
        "aapko",
        "kya",
        "hai",
        "hain",
        "kaise",
        "kyun",
        "kyunke",
        "mera",
        "meri",
        "mere",
        "batao",
        "samjhao",
        "karna",
        "karo",
        "krna",
        "acha",
        "theek",
        "nahi",
        "nahin",
        "chahiye"

    ];


    const words =
        text.split(/\s+/);


    const romanUrduDetected =
        romanUrduWords.some(
            function (word) {

                return words.includes(
                    word
                );

            }
        );


    if (romanUrduDetected) {

        return "ur-PK";

    }


    return "en-US";

}


/* ============================================================
   START / STOP VOICE
============================================================ */

function toggleVoiceInput() {

    if (!recognition) {

        alert(
            "Is browser mein voice input supported nahi hai."
        );

        return;

    }


    if (isRecording) {

        recognition.stop();

        return;

    }


    try {

        recognition.lang =
            detectSpeechInputLanguage();


        recognition.start();

    } catch (error) {

        console.warn(
            "Voice start error:",
            error
        );

    }

}


/* ============================================================
   DELETE CHAT
============================================================ */

async function deleteChat(
    event,
    chatId
) {

    event.stopPropagation();


    const confirmed =
        confirm(
            "Delete this chat?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/api/chats/${encodeURIComponent(chatId)}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {
            return;
        }


        if (
            currentChatId === chatId
        ) {

            currentChatId =
                null;

            clearChatUI();

        }


        await loadChatHistory();

    } catch (error) {

        console.error(
            "Delete chat error:",
            error
        );

    }

}


/* ============================================================
   CLEAR ALL HISTORY
============================================================ */

async function clearAllHistory() {

    const confirmed =
        confirm(
            "Delete all your chat history?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                "/api/chats",
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (data.success) {

            currentChatId =
                null;

            clearChatUI();

            await loadChatHistory();

        }

    } catch (error) {

        console.error(
            "Clear history error:",
            error
        );

    }

}


/* ============================================================
   CLEAR UI
============================================================ */

function clearChatUI() {

    showWelcome();

}


/* ============================================================
   SUGGESTIONS
============================================================ */

function useSuggestion(text) {

    input.value =
        text;

    autoResize();

    input.focus();

}


/* ============================================================
   ENTER TO SEND
============================================================ */

input.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ============================================================
   AUTO RESIZE
============================================================ */

input.addEventListener(
    "input",
    autoResize
);


function autoResize() {

    input.style.height =
        "auto";


    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";

}


/* ============================================================
   SCROLL
============================================================ */

function scrollToBottom() {

    chatArea.scrollTop =
        chatArea.scrollHeight;

}


/* ============================================================
   MOBILE SIDEBAR
============================================================ */

function closeMobileSidebar() {

    if (
        window.innerWidth <= 800
    ) {

        sidebar.classList.remove(
            "open"
        );

    }

}

</script>

</body>
</html>
