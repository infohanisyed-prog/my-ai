let currentChatId = null;

/* ============================================================

============================================================ */

document.addEventListener("DOMContentLoaded", async () => {

    loadTheme();

    setupVoiceRecognition();

    await loadChatHistory();

});


/* ============================================================
   THEME
============================================================ */

function toggleTheme() {

    document.body.classList.toggle("dark-mode");

    const dark =
        document.body.classList.contains("dark-mode");

    localStorage.setItem(
        "hani-theme",
        dark ? "dark" : "light"
    );

    updateThemeIcon();

}


function loadTheme() {

    const theme =
        localStorage.getItem("hani-theme");

    if (theme === "dark") {

        document.body.classList.add("dark-mode");

    }

    updateThemeIcon();

}


function updateThemeIcon() {

    if (!themeButton) return;

    const dark =
        document.body.classList.contains("dark-mode");

    themeButton.textContent =
        dark ? "☀" : "☾";

}


/* ============================================================
   SIDEBAR
============================================================ */

function toggleSidebar() {

    sidebar.classList.toggle("open");

}


/* ============================================================
   CHAT HISTORY
============================================================ */

async function loadChatHistory() {

    try {

        const response =
            await fetch("/api/chats");

        const data =
            await response.json();

        if (!data.success) return;

        renderChatList(data.chats);

        if (
            data.chats.length > 0 &&
            !currentChatId
        ) {

            await openChat(data.chats[0].id);

        }

    } catch (error) {

        console.error(
            "History error:",
            error
        );

    }

}


function renderChatList(chats) {

    chatList.innerHTML = "";

    if (!chats || !chats.length) {

        chatList.innerHTML = `
            <div class="empty-history">
                <div class="empty-history-icon">💬</div>
                No previous chats
            </div>
        `;

        return;
    }


    chats.forEach(chat => {

        const item =
            document.createElement("div");

        item.className =
            "chat-history-item";

        if (chat.id === currentChatId) {

            item.classList.add("active");

        }


        item.innerHTML = `

            <button
                class="chat-history-main"
                onclick="openChat('${escapeAttribute(chat.id)}')">

                <span class="chat-history-icon">
                    💬
                </span>

                <span class="chat-history-title">
                    ${escapeHtml(chat.title || "New Chat")}
                </span>

            </button>

            <button
                class="delete-chat"
                onclick="deleteChat(event, '${escapeAttribute(chat.id)}')"
                title="Delete chat">

                ⋮

            </button>
        `;

        chatList.appendChild(item);

    });

}


/* ============================================================
   CREATE CHAT
============================================================ */

async function createNewChat() {

    try {

        const response =
            await fetch(
                "/api/chats",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!data.success) {

            alert("Could not create a new chat.");

            return;

        }

        currentChatId =
            data.chat.id;

        clearChatUI();

        await loadChatHistory();

        closeMobileSidebar();

        input.focus();

    } catch (error) {

        console.error(
            "Create chat error:",
            error
        );

    }

}


/* ============================================================
   OPEN CHAT
============================================================ */

async function openChat(chatId) {

    try {

        const response =
            await fetch(
                `/api/chats/${encodeURIComponent(chatId)}`
            );

        const data =
            await response.json();

        if (!data.success) return;

        currentChatId =
            chatId;

        renderMessages(
            data.chat.messages || []
        );

        const chats =
            await getChatList();

        renderChatList(chats);

        closeMobileSidebar();

        input.focus();

    } catch (error) {

        console.error(
            "Open chat error:",
            error
        );

    }

}


async function getChatList() {

    try {

        const response =
            await fetch("/api/chats");

        const data =
            await response.json();

        return data.chats || [];

    } catch {

        return [];

    }

}

            message.role === "user"

            message.content,
            false

}

/* ============================================================
   ADD MESSAGE
============================================================ */

function addMessage(
    sender,
    message,
    shouldScroll = true
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        sender === "You"
            ? "message user-message"
            : "message ai-message";

    const avatar =
        sender === "You"
            ? "👤"
            : "✦";

    wrapper.innerHTML = `

        <div class="message-avatar">
            ${avatar}
        </div>

        <div class="message-content">

            <div class="message-name">
                ${sender}
            </div>

            <div class="message-text">
                ${formatMessage(message)}
            </div>

        </div>
    `;

    chatArea.appendChild(wrapper);

    if (shouldScroll) {

        scrollToBottom();

    }

}


/* ============================================================
   FORMAT MESSAGE
============================================================ */

function formatMessage(text) {

    const escaped =
        escapeHtml(text || "");

    return escaped

        .replace(
            /```([\s\S]*?)```/g,
            "<pre><code>$1</code></pre>"

```
    )

    .replace(
        /\n/g,
        "<br>"
    );
```

}

/* ============================================================
HTML ESCAPE
============================================================ */

function escapeHtml(text) {

```
const div =
    document.createElement("div");

div.textContent =
    String(text);

return div.innerHTML;
```

}

function escapeAttribute(text) {

```
return String(text)
    .replace(/\\/g, "\\\\")
    .replace(/'/g, "\\'");
```

}

/* ============================================================
SEND MESSAGE
============================================================ */

async function sendMessage() {

```
if (isLoading) return;

const message =
    input.value.trim();

if (!message) return;


if (!currentChatId) {

    try {

        const response =
            await fetch(
                "/api/chats",
                {
                    method: "POST"
                }
            );

        const data =
            await response.json();

        if (!data.success) return;

        currentChatId =
            data.chat.id;

    } catch {

        return;

    }

}


const welcome =
    document.querySelector(".welcome");

if (welcome) {

    welcome.remove();

}


addMessage(
    "You",
    message
);

input.value = "";

autoResize();

isLoading = true;

sendButton.disabled = true;
micButton.disabled = true;

showTyping();


try {

    const response =
        await fetch(
            "/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    message: message,
                    chat_id:
                        currentChatId
                })
            }
        );


    const data =
        await response.json();

    removeTyping();


    if (!response.ok) {

        addMessage(
            "AI",
            data.reply ||
            "Something went wrong."
        );

    } else {

        addMessage(
            "AI",
            data.reply
        );


        if (data.chat_id) {

            currentChatId =
                data.chat_id;

        }


        if (
            "speechSynthesis" in window &&
            data.reply
        ) {

            speak(data.reply);

        }


        await loadChatHistory();

    }

} catch (error) {

    console.error(error);

    removeTyping();

    addMessage(
        "AI",
        "⚠️ I couldn't connect to the server. Please try again."
    );

}


isLoading = false;

sendButton.disabled = false;
micButton.disabled = false;

input.focus();
```

}

/* ============================================================
VOICE RECOGNITION
============================================================ */

function setupVoiceRecognition() {

```
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    micButton.disabled = true;

    micButton.title =
        "Voice input is not supported by this browser.";

    micButton.style.opacity =
        "0.45";

    return;

}


recognition =
    new SpeechRecognition();

recognition.continuous = false;

recognition.interimResults = true;

recognition.maxAlternatives = 1;


recognition.onstart = () => {

    isRecording = true;

    micButton.classList.add(
        "recording"
    );

    micButton.setAttribute(
        "aria-label",
        "Stop recording"
    );

    micButton.title =
        "Stop recording";

};


recognition.onresult = (event) => {

    let transcript = "";

    for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
    ) {

        transcript +=
            event.results[i][0].transcript;

    }

    input.value =
        transcript;

    autoResize();

};


recognition.onend = () => {

    isRecording = false;

    micButton.classList.remove(
        "recording"
    );

    micButton.setAttribute(
        "aria-label",
        "Voice input"
    );

    micButton.title =
        "Voice input";

};


recognition.onerror = (event) => {

    console.error(
        "Voice recognition error:",
        event.error
    );

    isRecording = false;

    micButton.classList.remove(
        "recording"
    );

    if (event.error === "not-allowed") {

        alert(
            "Microphone permission allow karein taake voice input use ho sake."
        );

    }

};
```

}

/* ============================================================
SPEECH INPUT LANGUAGE
============================================================ */

function detectSpeechLanguage() {

```
const text =
    input.value.trim().toLowerCase();


if (
    /[\u0600-\u06FF]/.test(text)
) {

    return "ur-PK";

}


const romanUrduWords = [
    "kya",
    "hai",
    "hain",
    "mujhe",
    "aap",
    "kaise",
    "kyun",
    "mera",
    "meri",
    "mere",
    "batao",
    "samjhao",
    "chahiye",
    "mujhy",
    "apko",
    "aapko",
    "karo",
    "karna",
    "krna",
    "kyunke",
    "acha",
    "theek",
    "nahi",
    "nahin"
];


const isRomanUrdu =
    romanUrduWords.some(
        word =>
            text.split(/\s+/).includes(word)
    );


if (isRomanUrdu) {

    return "ur-PK";

}


return "en-US";
```

}

/* ============================================================
LOAD BROWSER VOICES
============================================================ */

function loadSpeechVoices() {

```
if (!("speechSynthesis" in window)) {
    return;
}


availableVoices =
    window.speechSynthesis.getVoices();


if (
    !availableVoices.length &&
    "onvoiceschanged" in window.speechSynthesis
) {

    window.speechSynthesis.onvoiceschanged =
        () => {

            availableVoices =
                window.speechSynthesis.getVoices();

        };

}
```

}

/* ============================================================
FIND BEST VOICE
============================================================ */

function getBestVoice(language) {

```
if (!availableVoices.length) {

    availableVoices =
        window.speechSynthesis.getVoices();

}


const target =
    language.toLowerCase();


let voice =
    availableVoices.find(
        v =>
            v.lang &&
            v.lang.toLowerCase() === target
    );


if (voice) return voice;


if (target.startsWith("ur")) {

    voice =
        availableVoices.find(
            v =>
                /urdu/i.test(v.name) ||
                /pakistan/i.test(v.name)
        );

    if (voice) return voice;

}


const prefix =
    target.split("-")[0];


voice =
    availableVoices.find(
        v =>
            v.lang &&
            v.lang
                .toLowerCase()
                .startsWith(prefix)
    );


return voice || null;
```

}

/* ============================================================
DETECT OUTPUT LANGUAGE
============================================================ */

function detectVoiceLanguage(text) {

```
if (!text) return "en-US";


if (
    /[\u0600-\u06FF]/.test(text)
) {

    return "ur-PK";

}


if (
    /[\u0900-\u097F]/.test(text)
) {

    return "hi-IN";

}


return "en-US";
```

}

/* ============================================================
SPEAK AI RESPONSE
============================================================ */

function speak(text) {

```
if (
    !("speechSynthesis" in window)
) {

    return;

}


window.speechSynthesis.cancel();


const cleanText =
    removeCodeForSpeech(text);


if (!cleanText.trim()) return;


const language =
    detectVoiceLanguage(cleanText);


const utterance =
    new SpeechSynthesisUtterance(
        cleanText
    );


const voice =
    getBestVoice(language);


if (voice) {

    utterance.voice =
        voice;

    utterance.lang =
        voice.lang;

} else {

    utterance.lang =
        language;

}


utterance.rate =
    language === "ur-PK"
        ? 0.88
        : 1;

utterance.pitch =
    1;

utterance.volume =
    1;


window.speechSynthesis.speak(
    utterance
);
```

}

/* ============================================================
REMOVE CODE BEFORE SPEECH
============================================================ */

function removeCodeForSpeech(text) {

````
return String(text)
    .replace(
        /```[\s\S]*?```/g,
        " Code example omitted. "
    )
    .replace(
        /`([^`]+)`/g,
        "$1"
    )
    .replace(
        /https?:\/\/\S+/g,
        " link "
    );
````

}

/* ============================================================
DELETE CHAT
============================================================ */

async function deleteChat(
event,
chatId
) {

```
event.stopPropagation();


const confirmed =
    confirm(
        "Delete this chat?"
    );


if (!confirmed) return;


try {

    const response =
        await fetch(
            `/api/chats/${encodeURIComponent(chatId)}`,
            {
                method: "DELETE"
            }
        );

    const data =
        await response.json();


    if (!data.success) return;


    if (
        currentChatId === chatId
    ) {

        currentChatId = null;

        clearChatUI();

    }


    await loadChatHistory();

} catch (error) {

    console.error(
        "Delete chat error:",
        error
    );

}
```

}

function scrollToBottom() {

```
chatArea.scrollTop =

```
if (
